# shots.yaml — one file = one Short. Claude edits ONLY this file per video (token-cheap).
# Units: metres, degrees, seconds. Timing comes from the narration (say:) after `s3d.py voice`.
title: "Why Bread Goes Stale 🤔"
fps: 30
voice: {engine: kokoro, voice: am_michael, speed: 1.08}
music: {track: auto, gain_db: -22}        # auto = first file in ~/.shorts3d/music (royalty-free), none = off
captions: {max_words: 3, case: sentence}
publish:
  title: "Why Bread Goes Stale 🤔"
  description: "It isn't drying out. Here's what really happens inside your bread overnight."
  hashtags: ["#shorts", "#science", "#food", "#howitworks"]

scenes:
  kitchen:
    set: {preset: kitchen, light: soft}
    props:
      table: {src: proc:table, at: [0, 0], surface: true}
      plate: {src: proc:plate, on: table, at: [0.05, -0.18]}
      bread: {src: proc:bread_slice, on: plate, yaw: 20}
      mug:   {src: proc:mug, on: table, at: [-0.32, 0.05], label: front}   # brand logo on the mug
    cast:
      hero: {char: rb_male, at: [0.05, -0.64], face: table}   # already at the table: the hook needs hands at t=0
    script:                                  # performance on the video clock (sequential unless at:)
      - hero.reach:   {target: bread, hand: R, at: 0.1}
      - hero.grasp:   {prop: bread}
      - hero.lift:    {to: show}             # brings it up to look at it
      - hero.face:    {expr: skeptical, at: S02, dur: 2.2}
      - hero.lift:    {to: mouth, at: S05}
      - hero.bite:    {}
      - hero.chew:    {cycles: 4, expr: yum}
      - hero.swallow: {}
      - hero.face:    {expr: smirk, at: S07, dur: 2.0}
  macro:
    set: {preset: void, world: {color: "#0B1B2B", strength: 0.25}, light: drama}
    props:
      crumb: {src: proc:bread_slice, at: [0, 0, 0.0], yaw: 0}
    fx:
      - {type: flow, path: [[-0.04, -0.02, 0.012], [0.0, 0.0, 0.03], [0.05, 0.02, 0.012]], color: "#3EC6E0", start: S03, end: S04.end}

shots:
  - id: S01                                  # HOOK: hands + object, mid-action, frame 0
    scene: kitchen
    say: "If you leave bread out overnight, it turns hard as a rock."
    cam: {size: insert, target: bread, angle: right, move: push_in}
    sfx: [{name: whoosh, at: 0}]
  - id: S02
    scene: kitchen
    say: "But here's the weird part: it isn't *drying* out."
    cam: {size: cu, target: hero.face, angle: front_left}
  - id: S03
    scene: macro
    say: "Baking melts the starch, so it soaks up water like a sponge."
    cam: {size: macro, target: crumb, angle: front, move: push_in, el: 35}
  - id: S04
    scene: macro
    say: "As it cools, the starch snaps back into tight *crystals*,"
    cam: {size: macro, target: crumb, angle: front_left, move: orbit, el: 30}
  - id: S05
    scene: kitchen
    say: "so the bread feels dry even though the water is still there."
    cam: {size: mcu, target: hero.face, angle: front_right}
  - id: S06
    scene: kitchen
    say: "Heat melts those crystals, and it turns soft again."
    cam: {size: cu, target: hero.mouth, angle: front_left, move: push_in}
    sfx: [{name: ding, at: "w:soft"}]
  - id: S07                                  # LOOP: last line flows back into the hook
    scene: kitchen
    say: "Which is exactly what happens..."
    cam: {size: medium, target: hero, angle: front_right, move: pull_out}
